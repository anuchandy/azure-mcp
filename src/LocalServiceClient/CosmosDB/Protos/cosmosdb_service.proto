syntax = "proto3";

option csharp_namespace = "AzureMcp.LocalServiceClient.CosmosDB.Grpc";

package cosmosdb_service;

// CosmosDB gRPC Service
service CosmosDBService {
  // List databases in a Cosmos DB account
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  
  // List containers in a Cosmos DB database
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
}

// Request to list databases
message ListDatabasesRequest {
  string account_name = 1;
  string subscription_id = 2;
  string auth_method = 3; // "Key", "Credential", or "ConnectionString"
  string tenant_id = 4;
}

// Response for listing databases
message ListDatabasesResponse {
  bool is_success = 1;
  string error_message = 2;
  repeated string database_names = 3;
}

// Request to list containers
message ListContainersRequest {
  string account_name = 1;
  string database_name = 2;
  string subscription_id = 3;
  string auth_method = 4; // "Key", "Credential", or "ConnectionString"
  string tenant_id = 5;
}

// Response for listing containers
message ListContainersResponse {
  bool is_success = 1;
  string error_message = 2;
  repeated string container_names = 3;
}
