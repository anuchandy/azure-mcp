}

// SQL Services

// Request to get a SQL database
message GetSqlDatabaseRequest {
  // The subscription ID
  string subscription_id = 1;
  // The resource group name
  string resource_group_name = 2;
  // The SQL server name
  string server_name = 3;
  // The database name
  string database_name = 4;
  // Optional tenant ID for multi-tenant scenarios
  string tenant_id = 5;
}

// Response containing SQL database details
message GetSqlDatabaseResponse {
  // Indicates if the operation was successful
  bool is_success = 1;
  // Error message if operation failed
  string error_message = 2;
  // SQL database details
  SqlDatabaseInfo database = 3;
}

// SQL database information
message SqlDatabaseInfo {
  // Database name
  string name = 1;
  // Database ID
  string id = 2;
  // Resource type
  string type = 3;
  // Database location
  string location = 4;
  // Database SKU information
  SqlDatabaseSku sku = 5;
  // Database status
  string status = 6;
  // Database collation
  string collation = 7;
  // Creation date (Unix timestamp)
  int64 creation_date = 8;
  // Maximum size in bytes
  int64 max_size_bytes = 9;
  // Service level objective
  string service_level_objective = 10;
  // Database edition
  string edition = 11;
  // Elastic pool name
  string elastic_pool_name = 12;
  // Earliest restore date (Unix timestamp)
  int64 earliest_restore_date = 13;
  // Read scale setting
  string read_scale = 14;
  // Zone redundant setting
  bool zone_redundant = 15;
}

// SQL database SKU information
message SqlDatabaseSku {
  // SKU name
  string name = 1;
  // SKU tier
  string tier = 2;
  // SKU capacity
  int32 capacity = 3;
  // SKU family
  string family = 4;
  // SKU size
  string size = 5;
}

// Request to get SQL Server Entra ID administrators
message GetSqlEntraAdministratorsRequest {
  // The subscription ID
  string subscription_id = 1;
  // The resource group name
  string resource_group_name = 2;
  // The SQL server name
  string server_name = 3;
  // Optional tenant ID for multi-tenant scenarios
  string tenant_id = 4;
}

// Response containing SQL Server Entra ID administrators
message GetSqlEntraAdministratorsResponse {
  // Indicates if the operation was successful
  bool is_success = 1;
  // Error message if operation failed
  string error_message = 2;
  // List of Entra ID administrators
  repeated SqlServerEntraAdministrator administrators = 3;
}

// SQL Server Entra ID administrator information
message SqlServerEntraAdministrator {
  // Administrator name
  string name = 1;
  // Administrator ID
  string id = 2;
  // Resource type
  string type = 3;
  // Administrator type
  string administrator_type = 4;
  // Login name
  string login = 5;
  // Security identifier (SID)
  string sid = 6;
  // Tenant ID
  string tenant_id = 7;
  // Whether Azure AD only authentication is enabled
  bool azure_ad_only_authentication = 8;
}

// Search Services

// Request to list Azure Search services in a subscription
message ListSearchServicesRequest {
  // The subscription ID
  string subscription_id = 1;
  // Optional tenant ID for multi-tenant scenarios
