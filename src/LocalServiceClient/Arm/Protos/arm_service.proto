  // Update channel
  string update_channel = 18;
  // Zonal allocation policy
  string zonal_allocation_policy = 19;
  // Linked servers
  repeated string linked_servers = 20;
  // Private endpoint connections
  repeated string private_endpoint_connections = 21;
  // Availability zones
  repeated string zones = 22;
  // Redis configuration
  RedisCacheConfiguration configuration = 23;
  // Managed identity information
  ManagedIdentityInfo identity = 24;
  // Resource tags
  map<string, string> tags = 25;
}

// Redis cache configuration
message RedisCacheConfiguration {
  // Indicates whether RDB (Redis Database Backup) is enabled for the Redis cache
  bool is_rdb_backup_enabled = 1;
  // Number of minutes between RDB backups
  string rdb_backup_frequency = 2;
  // Indicates the maximum number of snapshots for RDB backup
  int32 rdb_backup_max_snapshot_count = 3;
  // Indicates whether AOF (Append Only File) backup is enabled for the Redis cache
  bool is_aof_backup_enabled = 4;
  // Number of megabytes of memory reserved for fragmentation per shard
  string max_fragmentation_memory_reserved = 5;
  // The eviction strategy used when your data won't fit within the cache memory limit
  string max_memory_policy = 6;
  // Number of megabytes of memory reserved for non-cache usage per shard e.g. failover
  string max_memory_reserved = 7;
  // Number of megabytes of memory reserved for non-cache usage per shard e.g. failover
  string max_memory_delta = 8;
  // Maximum number of client connections
  int32 max_clients = 9;
  // The keyspace events which should be monitored
  string notify_keyspace_events = 10;
  // Preferred authentication method to communicate to storage account used for data archive
  string preferred_data_archive_auth_method = 11;
  // Preferred authentication method to communicate to storage account used for data persistence
  string preferred_data_persistence_auth_method = 12;
  // Zonal Configuration
  string zonal_configuration = 13;
  // Indicates whether client connection authentication is disabled
  string auth_not_required = 14;
  // SubscriptionId of the storage account for persistence (AOF/RDB) using ManagedIdentity
  string storage_subscription_id = 15;
  // Indicates whether Microsoft Entra ID authentication has been enabled for client connections to the cache
  bool is_entra_id_auth_enabled = 16;
}

// Redis access policy assignment data
message RedisAccessPolicyAssignment {
  // Name of the access policy
  string access_policy_name = 1;
  // Name of the identity assigned to an access policy
  string identity_name = 2;
  // Provisioning status of the access policy assignment
  string provisioning_state = 3;
}

// Redis cluster data
message RedisCluster {
  // Cluster name
  string name = 1;
  // Subscription ID
  string subscription_id = 2;
  // Resource group name
  string resource_group_name = 3;
  // Cluster location
  string location = 4;
  // SKU information
  string sku = 5;
  // Provisioning state
  string provisioning_state = 6;
  // Resource state
  string resource_state = 7;
  // Redis version
  string redis_version = 8;
  // Host name
  string host_name = 9;
  // Minimum TLS version
  string minimum_tls_version = 10;
  // Private endpoint connections
  repeated string private_endpoint_connections = 11;
  // Availability zones
  repeated string zones = 12;
  // Managed identity information
  ManagedIdentityInfo identity = 13;
  // Resource tags
  map<string, string> tags = 14;
}

// Redis database data
message RedisDatabase {
  // Database name
  string name = 1;
  // Cluster name
  string cluster_name = 2;
  // Resource group name
  string resource_group_name = 3;
  // Subscription ID
  string subscription_id = 4;
  // Client protocol
  string client_protocol = 5;
  // Port number
  int32 port = 6;
  // Provisioning state
  string provisioning_state = 7;
  // Resource state
  string resource_state = 8;
  // Clustering policy
  string clustering_policy = 9;
  // Eviction policy
  string eviction_policy = 10;
  // Whether AOF (Append Only File) is enabled
  bool is_aof_enabled = 11;
  // Whether RDB (Redis Database) backup is enabled
  bool is_rdb_enabled = 12;
  // Sets the frequency at which data is written to disk
  string aof_frequency = 13;
  // Sets the frequency at which a snapshot of the database is created
  string rdb_frequency = 14;
  // Optional set of redis modules to enable in this database
  repeated RedisModule modules = 15;
  // Name for the group of geo-linked database resources
  string geo_replication_group_nickname = 16;
  // List of databases linked with this database for geo-replication
  repeated string geo_replication_linked_databases = 17;
}

// Redis module data
message RedisModule {
