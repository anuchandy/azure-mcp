syntax = "proto3";

option csharp_namespace = "AzureMcp.LocalService.Identity.Grpc";

package identity;

// The identity service provides Azure token authentication
service IdentityService {
  // Gets an access token
  rpc GetToken(TokenRequest) returns (TokenResponse);
}

// Request message for token acquisition
message TokenRequest {
  // The scopes for which to request the token
  repeated string scopes = 1;
  
  // Optional parent request ID for correlation
  optional string parent_request_id = 2;
  
  // Optional claims to include in the token request
  optional string claims = 3;
  
  // Optional tenant ID to use for authentication
  optional string tenant_id = 4;
  
  // Optional timeout in seconds for the request
  optional int32 timeout_seconds = 5;
}

// Response message containing the access token
message TokenResponse {
  // The access token string
  string token = 1;
  
  // The expiration time as UTC ticks (DateTimeOffset.UtcTicks)
  int64 expires_on_ticks = 2;
  
  // Whether the operation was successful
  bool success = 3;
  
  // Error message if the operation failed
  optional string error_message = 4;
  
  // Error type for better error handling
  optional string error_type = 5;
  
  // Additional error details for Azure.Identity exceptions
  optional ErrorDetails error_details = 6;
}

// Detailed error information for better exception handling
message ErrorDetails {
  // Whether this is an authentication failure
  bool is_authentication_failure = 1;
  
  // The underlying error code if available
  optional string error_code = 2;
  
  // Additional context about the error
  optional string error_context = 3;
  
  // Whether the error is retryable
  bool is_retryable = 4;
}
